name: Build Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - "212TrendTrader/app/**"
      - "212TrendTrader/build.gradle.kts"
      - "212TrendTrader/settings.gradle.kts"
      - "212TrendTrader/gradle/**"
      - "212TrendTrader/gradlew"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 212TrendTrader

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 212TrendTrader-debug
          path: 212TrendTrader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
